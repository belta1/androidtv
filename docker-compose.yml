name: magictv

services:
  android:
    image: redroid/redroid:12.0.0-latest
    container_name: magictv-android
    privileged: true
    restart: unless-stopped
    command:
      - androidboot.redroid_width=${WIDTH:-1920}
      - androidboot.redroid_height=${HEIGHT:-1080}
      - androidboot.redroid_dpi=${DPI:-240}
      - androidboot.redroid_fps=${FPS:-60}
      - androidboot.redroid_gpu_mode=${GPU_MODE:-guest}
      - ro.setupwizard.mode=DISABLED
    volumes:
      - android-data:/data
    # GPU_MODE=host: uncomment to use the host's Intel/AMD iGPU (much lower CPU)
    # devices:
    #   - /dev/dri:/dev/dri
    mem_limit: ${ANDROID_MEM:-2g}
  # Keeps the APKs installed on the shared Android. The windows are opened per
  # desktop user by the `magictv` command (see host-setup.sh), same image.
  installer:
    image: ghcr.io/belta1/androidtv-viewer:latest
    container_name: magictv-installer
    restart: unless-stopped
    depends_on:
      - android
    environment:
      - MODE=service
      - ANDROID_HOST=android:5555
    volumes:
      - ${APK_DIR:-/home/belta1/docker_compose/config/magictv}:/apks:ro
      - installer-state:/state
    mem_limit: 64m

networks:
  default:
    name: magictv     # fixed name: `magictv` windows join it to reach "android"

volumes:
  android-data:
  installer-state:
